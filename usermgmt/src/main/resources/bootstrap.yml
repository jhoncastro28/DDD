server:
  port: 8080

spring:
  application:
    name: UserManagementService
  profiles:
    active: DEV
  cloud:
    config:
      enabled: false
      name: microservices-config
      uri: http://localhost:8888/
      username: config_user
      password: config_user
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /
    username: guest
    password: guest
  data:
    mongodb:
      uri: mongodb://localhost:27017/microservice
      database: microservice

message: Welcome to User Management Service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka